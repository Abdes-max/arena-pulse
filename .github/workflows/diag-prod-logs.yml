# Temporary, one-off: fixes the `/app/uploads` volume ownership on the VPS
# (created root:root the first time it was ever mounted, before the `api`
# container's non-root `nestjs` user existed to need write access -- see the
# EACCES on mkdir '/app/uploads/team-logos' this uncovered) and reads recent
# `api` container logs. Not meant to stay in the repo -- delete once the
# underlying bug is understood/fixed (see api.Dockerfile follow-up).
name: (diag) Read prod api container logs

on:
  workflow_dispatch: {}

jobs:
  diag:
    name: Fix uploads ownership + read logs on Hostinger VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: chown uploads volume + docker compose logs api
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 90s
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f infra/deployment/docker-compose.prod.yml --env-file infra/deployment/.env exec -u root -T api chown -R nestjs:nodejs /app/uploads
            docker compose -f infra/deployment/docker-compose.prod.yml --env-file infra/deployment/.env exec -T api ls -la /app/uploads
