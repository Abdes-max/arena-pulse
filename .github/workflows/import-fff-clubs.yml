# Manual: loads apps/api/prisma/data/fff-clubs.csv (the FFF club directory,
# exported from a fully loaded database) into production's FffClub table --
# same mechanics as seed-padel-example.yml, the file being part of the
# already-built `migrate` image. Upserts by affiliation n°, so it's safe to
# re-run after updating the file; a column absent from the file keeps the
# stored values. sync-fff-clubs.yml then keeps the table current quarterly.
name: Import FFF club directory

on:
  workflow_dispatch: {}

jobs:
  import:
    name: Import on Hostinger VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run import-fff-clubs.js inside the migrate image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 90s
          # ~17 700 upserts -- a couple of minutes.
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f infra/deployment/docker-compose.prod.yml --env-file infra/deployment/.env run --rm migrate node dist/prisma/import-fff-clubs.js prisma/data/fff-clubs.csv
