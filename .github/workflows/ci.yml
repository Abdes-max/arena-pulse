name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  web:
    name: Web (Angular) — lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx ng lint design-tokens
      - run: npx ng lint design-system
      - run: npm run lint:public-web
      - run: npm run lint:admin-web
      - run: npm run build:public-web
      - run: npm run build:admin-web
      - run: npm run test:public-web
      - run: npm run test:admin-web

  api:
    name: API (NestJS) — lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena_pulse
          POSTGRES_PASSWORD: arena_pulse
          POSTGRES_DB: arena_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena_pulse -d arena_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arena_pulse:arena_pulse@localhost:5432/arena_pulse?schema=public
      JWT_SECRET: ci-only-secret-never-used-outside-tests
      JWT_EXPIRES_IN: 3600s
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:4300
      ADMIN_WEB_URL: http://localhost:4300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:e2e

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked by git — remove it and use .env.example instead."
            exit 1
          fi
          echo "No committed .env files found."
