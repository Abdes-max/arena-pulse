# SSHes into the VPS and re-runs the exact same commands documented in
# infra/deployment/README.md's "Mettre à jour" section (git pull + docker
# compose up -d --build). Deliberately does not push/pull pre-built GHCR
# images here -- the `migrate` service needs the `build` Dockerfile stage
# (has the Prisma CLI), which the docker-publish job in ci.yml never pushes
# to GHCR (only the pruned `runtime` stage is published) -- see
# docs/architecture/adr/0004-deployment-strategy.md.
#
# Runs automatically on every push to master -- same "merge = deployed"
# model as deploy-android.yml/deploy-ios.yml. workflow_dispatch is kept for
# a manual re-run (e.g. retrying a transient SSH timeout without an empty
# commit, see the timeout note below).
#
# `caddy` has no `build:` in docker-compose.prod.yml (fixed `caddy:2-alpine`
# image) and its Caddyfile is a read-only bind-mount, not baked into an
# image -- `docker compose up -d` only recreates a container when the
# *service definition* changes (image tag, env, volumes...), never just
# because a bind-mounted file's contents changed on disk. Found the hard way
# right after shipping security headers (feat/175): `up -d --build` reported
# success and the deploy looked fine, but Caddy kept serving the old config
# from before the container was last created, silently making the new
# headers a no-op in production.
#
# Tried `caddy reload --config ...` first (hot-swap via the local admin API,
# no dropped connections) in feat/176 -- it exited 0 and logged normal-looking
# "using/adapted config" lines, but the live response still had none of the
# new headers even after that deploy succeeded, so something about this
# host's Caddy/admin-API setup makes it silently not take effect. Not worth
# the extra investigation time for what is, at this project's scale, a
# non-issue: `restart caddy` forces the container to re-exec `caddy run
# --config /etc/caddy/Caddyfile` from scratch, which re-reads the bind-mounted
# file unconditionally -- guaranteed correct, at the cost of a few seconds of
# reconnects on the caddy hop (web/api are untouched, no downtime there).
name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull latest master and restart the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Default (30s) has intermittently timed out dialing this host from
          # GitHub-hosted runners even when the VPS itself was confirmed
          # reachable seconds later -- generous headroom rather than chasing
          # the exact network cause.
          timeout: 90s
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            docker compose -f infra/deployment/docker-compose.prod.yml --env-file infra/deployment/.env up -d --build
            docker compose -f infra/deployment/docker-compose.prod.yml --env-file infra/deployment/.env restart caddy
            docker image prune -f
