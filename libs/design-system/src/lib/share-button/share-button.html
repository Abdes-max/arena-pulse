<button
  type="button"
  class="ap-share-button"
  [class.ap-share-button--copied]="copied()"
  [class.ap-share-button--failed]="failed()"
  [attr.aria-label]="copied() ? 'Lien copié' : failed() ? 'Échec du partage' : 'Partager'"
  (click)="share()"
>
  @if (copied()) {
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
    </svg>
    <span class="ap-share-button__label">Copié</span>
  } @else if (failed()) {
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 2 1 21h22L12 2zm0 15a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zm1-3h-2v-5h2v5z"
      />
    </svg>
    <span class="ap-share-button__label">Échec</span>
  } @else {
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        fill="currentColor"
        d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"
      />
    </svg>
  }
</button>
