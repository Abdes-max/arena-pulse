<div class="ap-tabs" role="tablist" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="tab"
      class="ap-tabs__tab"
      [class.ap-tabs__tab--active]="option.value === value()"
      [attr.aria-selected]="option.value === value()"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
