<ng-template #content><ng-content /></ng-template>

@if (routerLink(); as link) {
  <a
    class="ap-button"
    [routerLink]="link"
    routerLinkActive="ap-button--active"
    [routerLinkActiveOptions]="{ exact: routerLinkExact() }"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else if (href(); as url) {
  <a class="ap-button" [href]="url" [target]="target()" rel="noopener">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button class="ap-button" [type]="type()" [disabled]="disabled()">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
