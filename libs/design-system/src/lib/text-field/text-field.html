<label
  [for]="inputId"
  class="ap-text-field__label"
  [class.ap-text-field__label--hidden]="hideLabel()"
>
  {{ label() }}
</label>
<input
  [id]="inputId"
  class="ap-text-field__input"
  [type]="type()"
  [value]="displayValue()"
  [disabled]="disabled()"
  [attr.placeholder]="placeholder()"
  [attr.autocomplete]="autocomplete()"
  [attr.min]="min()"
  [attr.aria-invalid]="errorMessage() ? true : null"
  [attr.aria-describedby]="errorMessage() ? errorId : null"
  (input)="handleInput($event)"
  (blur)="handleBlur()"
/>
@if (errorMessage(); as message) {
  <p [id]="errorId" class="ap-text-field__error" role="alert">{{ message }}</p>
}
