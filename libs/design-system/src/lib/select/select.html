<label [for]="selectId" class="ap-select__label" [class.ap-select__label--hidden]="hideLabel()">
  {{ label() }}
</label>
<select
  #selectEl
  [id]="selectId"
  class="ap-select__control"
  [disabled]="disabled()"
  (change)="handleChange($event)"
  (blur)="handleBlur()"
>
  @for (option of options(); track option.value) {
    <option
      [value]="option.value"
      [selected]="option.value === displayValue()"
      [disabled]="option.disabled ?? false"
    >
      {{ option.label }}
    </option>
  }
</select>
