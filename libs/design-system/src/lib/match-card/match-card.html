<article class="ap-match-card">
  <div class="ap-match-card__meta">
    @if (competitionLabel(); as label) {
      <span class="ap-match-card__competition">{{ label }}</span>
    }
    @if (venue(); as v) {
      <span class="ap-match-card__venue">{{ v }}</span>
    }
    <ap-badge class="ap-match-card__status" [status]="statusBadge()" />
  </div>

  <div class="ap-match-card__teams">
    <div class="ap-match-card__team" [class.ap-match-card__team--winner]="homeIsWinner()">
      <span class="ap-match-card__team-name">{{ homeTeam().name }}</span>
      @if (hasScore()) {
        <span class="ap-match-card__score">{{ homeScore() }}</span>
      }
    </div>
    <div class="ap-match-card__team" [class.ap-match-card__team--winner]="awayIsWinner()">
      <span class="ap-match-card__team-name">{{ awayTeam().name }}</span>
      @if (hasScore()) {
        <span class="ap-match-card__score">{{ awayScore() }}</span>
      }
    </div>
  </div>

  @if (!hasScore() && kickoff(); as time) {
    <div class="ap-match-card__footer">
      <span class="ap-match-card__time">{{ time }}</span>
      @if (venue(); as v) {
        <span class="ap-match-card__venue">{{ v }}</span>
      }
    </div>
  }
</article>
