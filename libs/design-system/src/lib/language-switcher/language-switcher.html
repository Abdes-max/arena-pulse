<button
  type="button"
  class="ap-language-switcher__trigger"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  aria-label="Choisir la langue"
  (click)="toggle()"
>
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path
      fill="currentColor"
      d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8M12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96M4.26 14a7.9 7.9 0 0 1 0-4h3.38a16.6 16.6 0 0 0 0 4zm.81 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.07 16m2.95-8H4.26a8.03 8.03 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.02 8M12 19.96a15.3 15.3 0 0 1-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96M14.34 14H9.66a14.6 14.6 0 0 1 0-4h4.68a14.6 14.6 0 0 1 0 4m.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56M16.36 14a16.6 16.6 0 0 0 0-4h3.38a7.9 7.9 0 0 1 0 4z"
    />
  </svg>
  <span class="ap-language-switcher__code">{{ language().toUpperCase() }}</span>
  <svg
    class="ap-language-switcher__chevron"
    viewBox="0 0 24 24"
    width="14"
    height="14"
    aria-hidden="true"
  >
    <path fill="currentColor" d="M7 10l5 5 5-5z" />
  </svg>
</button>

@if (open()) {
  <ul
    class="ap-language-switcher__panel"
    role="listbox"
    [attr.aria-label]="'Langue: ' + currentLabel()"
  >
    @for (option of languages(); track option.code) {
      <li
        class="ap-language-switcher__option"
        role="option"
        tabindex="0"
        [attr.aria-selected]="option.code === language()"
        (click)="select(option.code)"
        (keydown.enter)="select(option.code)"
        (keydown.space)="select(option.code); $event.preventDefault()"
      >
        <span>{{ option.label }}</span>
        @if (option.code === language()) {
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
          </svg>
        }
      </li>
    }
  </ul>
}
