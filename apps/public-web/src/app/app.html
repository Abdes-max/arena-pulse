<div class="showcase" [attr.data-theme]="theme()" [attr.data-mode]="mode()">
  <header class="showcase__header">
    <h1>Arena Pulse — aperçu du design system</h1>
    <div class="showcase__controls">
      <div class="showcase__tabs">
        @for (t of themes; track t.name) {
          <button
            type="button"
            class="showcase__tab"
            [class.showcase__tab--active]="theme() === t.name"
            (click)="setTheme(t.name)"
          >
            {{ t.label }}
          </button>
        }
      </div>
      <button type="button" class="showcase__mode" (click)="toggleMode()">
        {{ mode() === 'light' ? 'Passer en sombre' : 'Passer en clair' }}
      </button>
    </div>
  </header>

  <section class="showcase__section">
    <h2>Boutons</h2>
    <div class="showcase__row">
      <ap-button variant="primary">Publier le tournoi</ap-button>
      <ap-button variant="secondary">Modifier</ap-button>
      <ap-button variant="ghost">Annuler</ap-button>
      <ap-button variant="primary" [disabled]="true">Indisponible</ap-button>
    </div>
  </section>

  <section class="showcase__section">
    <h2>Statuts</h2>
    <div class="showcase__row">
      <ap-badge status="upcoming" />
      <ap-badge status="live" />
      <ap-badge status="finished" />
      <ap-badge status="postponed" />
      <ap-badge status="cancelled" />
      <ap-badge status="qualified" />
      <ap-badge status="eliminated" />
    </div>
  </section>

  <section class="showcase__section">
    <h2>Cartes de match</h2>
    <div class="showcase__grid">
      <ap-match-card
        variant="featured"
        [homeTeam]="{ name: 'Vento FC' }"
        [awayTeam]="{ name: 'Atlas United' }"
        [homeScore]="2"
        [awayScore]="1"
        competitionLabel="Finale"
        venue="Terrain 1"
      />
      <ap-match-card
        variant="upcoming"
        [homeTeam]="{ name: 'Lumen SC' }"
        [awayTeam]="{ name: 'Nordik AC' }"
        kickoff="15:30"
        venue="Terrain 2"
        competitionLabel="Poule A"
      />
      <ap-match-card
        variant="result"
        [homeTeam]="{ name: 'Cobalt City' }"
        [awayTeam]="{ name: 'Ferro Sport' }"
        [homeScore]="0"
        [awayScore]="3"
        competitionLabel="Poule B"
      />
      <ap-match-card
        variant="compact"
        [homeTeam]="{ name: 'Vento FC' }"
        [awayTeam]="{ name: 'Cobalt City' }"
        [homeScore]="3"
        [awayScore]="0"
        competitionLabel="Poule A"
      />
    </div>
  </section>
</div>
