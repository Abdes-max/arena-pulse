<!doctype html>
<html lang="fr" data-theme="ink-signal" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <title>TournArena</title>
    <base href="/" />
    <!--
      viewport-fit=cover is required for iOS's env(safe-area-inset-*) to be
      exposed at all -- without it, Ionic's ion-header/ion-tab-bar (both used
      in shell/tournament-shell.html) fall back to zero safe-area insets even
      though the OS still reserves that space, so their touch targets end up
      squeezed under the notch (header) and the home indicator gesture area
      (tab bar) on any iPhone X-and-later, including the 11 -- reported after
      the first TestFlight install.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      All 3 organizer-selectable tournament themes' fonts are loaded here
      (not just Ink & Signal) since this app can render any of them per
      tournament — see docs/design/visual-language.md.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=Russo+One&family=Chakra+Petch:wght@300;400;500;600&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
