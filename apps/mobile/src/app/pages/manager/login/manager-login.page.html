<ion-header>
  <ion-toolbar>
    <button
      type="button"
      class="manager-auth__icon-btn"
      slot="start"
      (click)="goBack()"
      [attr.aria-label]="'manager.back' | transloco"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </button>
    <a class="manager-auth__brand" slot="start" routerLink="/" aria-label="TournArena"
      ><ap-logo [wordmark]="false"
    /></a>
    <ion-title>{{ 'manager.login.title' | transloco }}</ion-title>
  </ion-toolbar>
</ion-header>

<form class="manager-auth__form" [formGroup]="form" (ngSubmit)="submit()">
  <ion-content class="manager-auth">
    <div class="manager-auth__fields">
      <p class="manager-auth__lede">{{ 'manager.login.lede' | transloco }}</p>
      <ap-text-field
        [label]="'manager.fields.email' | transloco"
        type="email"
        formControlName="email"
        autocomplete="email"
      />
      <ap-text-field
        [label]="'manager.fields.password' | transloco"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </div>
  </ion-content>
  <ion-footer class="manager-auth__footer">
    <ap-button type="submit" [fullWidth]="true" [disabled]="submitting()">
      {{ 'manager.login.submit' | transloco }}
    </ap-button>
    <p class="manager-auth__linkrow">
      {{ 'manager.login.noAccount' | transloco }}
      <a routerLink="/espace-responsable/creer-un-compte" queryParamsHandling="preserve">{{
        'manager.login.create' | transloco
      }}</a>
    </p>
  </ion-footer>
</form>
