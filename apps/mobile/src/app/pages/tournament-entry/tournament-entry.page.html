<ion-content class="tournament-entry-page">
  <div class="tournament-entry-page__hero">
    <ap-logo />
    <h1 class="tournament-entry-page__title">Suivre un tournoi</h1>
    <p class="tournament-entry-page__hint">Entrez l'identifiant fourni par l'organisateur.</p>
  </div>

  <ap-text-field
    label="Identifiant du tournoi"
    placeholder="ex. coupe-de-printemps-2026"
    [value]="slug()"
    (valueChange)="onSlugChange($event)"
  />
  <ion-button expand="block" (click)="go()">Voir le tournoi</ion-button>
</ion-content>
