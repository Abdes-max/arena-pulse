<ion-content class="tournament-entry-page">
  <div class="tournament-entry-page__hero">
    <ap-logo />
    <h1 class="tournament-entry-page__title">Suivre un tournoi</h1>
    <p class="tournament-entry-page__hint">Entrez l'identifiant fourni par l'organisateur.</p>
  </div>

  <ap-text-field
    label="Identifiant du tournoi"
    placeholder="ex. coupe-de-printemps-2026"
    [value]="slug()"
    (valueChange)="onSlugChange($event)"
  />
  <ion-button expand="block" (click)="go()">Voir le tournoi</ion-button>

  @if (tournaments().length > 0) {
    <section class="tournament-entry-page__published">
      <h2 class="tournament-entry-page__published-title">Tournois publiés</h2>
      <ap-text-field
        class="tournament-entry-page__published-search"
        type="search"
        label="Rechercher un tournoi"
        [hideLabel]="true"
        placeholder="Rechercher un tournoi…"
        [value]="query()"
        (valueChange)="onQueryChange($event)"
      />
      @if (filteredTournaments().length === 0) {
        <p class="tournament-entry-page__published-empty">Aucun tournoi trouvé.</p>
      } @else {
        <div class="tournament-entry-page__published-list">
          @for (t of filteredTournaments(); track t.id) {
            <button
              type="button"
              class="tournament-entry-page__published-item"
              (click)="goToTournament(t)"
            >
              <ap-tournament-card
                [name]="t.name"
                [sportName]="t.sportName"
                [startDate]="t.startDate"
                [endDate]="t.endDate"
                [isOnline]="t.isOnline"
                [location]="t.location"
              />
            </button>
          }
        </div>
      }
    </section>
  }
</ion-content>
