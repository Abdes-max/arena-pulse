<main class="player-register-page auth-shell">
  <header class="auth-shell__hero" data-theme="ink-signal" data-mode="dark">
    <div class="auth-shell__hero-inner">
      <a class="auth-shell__home" routerLink="/" aria-label="TournArena">
        <ap-logo variant="on-dark" />
      </a>
      <h1>Créer un compte responsable d'équipe</h1>
      <p class="auth-shell__lede">
        Il sert à pré-inscrire votre équipe aux tournois depuis leur site public. Il est distinct
        d'un compte organisateur.
      </p>
    </div>
  </header>
  <form
    class="player-register-page__card auth-shell__card"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <ap-text-field label="Prénom" formControlName="firstName" autocomplete="given-name" />
    <ap-text-field label="Nom" formControlName="lastName" autocomplete="family-name" />
    <ap-text-field label="Email" type="email" formControlName="email" autocomplete="email" />
    <ap-text-field
      label="Mot de passe"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
    <ap-button type="submit" [disabled]="submitting()">Créer mon compte</ap-button>
    <p class="player-register-page__footer">
      Déjà un compte ? <a routerLink="/player/login">Se connecter</a>
    </p>
  </form>
</main>
