<main class="player-register-page">
  <form class="player-register-page__card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Créer un compte joueur</h1>
    <p class="player-register-page__hint">
      Ce compte sert à vous inscrire à des tournois sur leur site public — il est distinct d'un
      compte organisateur.
    </p>
    <ap-text-field label="Prénom" formControlName="firstName" autocomplete="given-name" />
    <ap-text-field label="Nom" formControlName="lastName" autocomplete="family-name" />
    <ap-text-field label="Email" type="email" formControlName="email" autocomplete="email" />
    <ap-text-field
      label="Mot de passe"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
    @if (errorMessage(); as message) {
      <p class="player-register-page__error" role="alert">{{ message }}</p>
    }
    <ap-button type="submit" [disabled]="submitting()">Créer mon compte</ap-button>
    <p class="player-register-page__footer">
      Déjà un compte ? <a routerLink="/player/login">Se connecter</a>
    </p>
  </form>
</main>
