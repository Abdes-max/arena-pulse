<main class="player-login-page auth-shell">
  <header class="auth-shell__hero" data-theme="ink-signal" data-mode="dark">
    <div class="auth-shell__hero-inner">
      <a class="auth-shell__home" routerLink="/" aria-label="TournArena">
        <ap-logo variant="on-dark" />
      </a>
      <h1>Connexion responsable d'équipe</h1>
      <p class="auth-shell__lede">
        Pour pré-inscrire votre équipe aux tournois et suivre vos demandes.
      </p>
    </div>
  </header>
  <form class="player-login-page__card auth-shell__card" [formGroup]="form" (ngSubmit)="submit()">
    <ap-text-field label="Email" type="email" formControlName="email" autocomplete="email" />
    <ap-text-field
      label="Mot de passe"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    <ap-button type="submit" [disabled]="submitting()">Se connecter</ap-button>
    <p class="player-login-page__footer">
      Pas encore de compte ?
      <a routerLink="/espace-responsable/creer-un-compte" queryParamsHandling="preserve"
        >Créer un compte responsable</a
      >
    </p>
  </form>
</main>
