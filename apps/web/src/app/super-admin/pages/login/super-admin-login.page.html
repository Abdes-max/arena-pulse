<main class="super-admin-login-page">
  <form class="super-admin-login-page__card" [formGroup]="form" (ngSubmit)="submit()">
    <ap-logo class="super-admin-login-page__brand" />
    <h1>Super admin</h1>
    <ap-text-field label="Email" type="email" formControlName="email" autocomplete="email" />
    <ap-text-field
      label="Mot de passe"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (errorMessage(); as message) {
      <p class="super-admin-login-page__error" role="alert">{{ message }}</p>
    }
    <ap-button type="submit" [disabled]="submitting()">Se connecter</ap-button>
  </form>
</main>
