<div class="app-shell">
  <a class="skip-link" href="#main-content" (click)="focusMainContent($event)"
    >Aller au contenu principal</a
  >

  <header class="app-shell__header">
    <div class="app-shell__topbar">
      <div class="app-shell__topbar-left">
        @if (showBrandMark()) {
          <ap-logo />
        }
        <nav class="app-shell__nav">
          <a routerLink="/admin/tournaments" routerLinkActive="app-shell__link--active">Tournois</a>
          <a routerLink="/admin/collaborators" routerLinkActive="app-shell__link--active"
            >Collaborateurs</a
          >
          <a
            routerLink="/admin/organization/subscription"
            routerLinkActive="app-shell__link--active"
            >Abonnement</a
          >
        </nav>
      </div>
      <div class="app-shell__controls">
        <ap-theme-mode-toggle [mode]="mode()" (modeChange)="onModeChange($event)" />
        <ap-button type="button" variant="ghost" (click)="logout()">Se déconnecter</ap-button>
      </div>
      <button
        type="button"
        class="app-shell__nav-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="app-shell-mobile-menu"
        aria-label="Menu"
      >
        @if (mobileMenuOpen()) {
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4 4 L16 16 M16 4 L4 16" />
          </svg>
        } @else {
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3 5 L17 5 M3 10 L17 10 M3 15 L17 15" />
          </svg>
        }
      </button>
    </div>

    @if (mobileMenuOpen()) {
      <div class="app-shell__mobile-menu" id="app-shell-mobile-menu">
        <a
          class="app-shell__mobile-menu-link"
          routerLink="/admin/tournaments"
          routerLinkActive="app-shell__link--active"
          (click)="closeMobileMenu()"
          >Tournois</a
        >
        <a
          class="app-shell__mobile-menu-link"
          routerLink="/admin/collaborators"
          routerLinkActive="app-shell__link--active"
          (click)="closeMobileMenu()"
          >Collaborateurs</a
        >
        <a
          class="app-shell__mobile-menu-link"
          routerLink="/admin/organization/subscription"
          routerLinkActive="app-shell__link--active"
          (click)="closeMobileMenu()"
          >Abonnement</a
        >
        <div class="app-shell__mobile-menu-controls">
          <ap-theme-mode-toggle [mode]="mode()" (modeChange)="onModeChange($event)" />
          <ap-button type="button" variant="ghost" (click)="logout()">Se déconnecter</ap-button>
        </div>
      </div>
    }
    @if (tournamentId(); as id) {
      <app-tournament-submenu
        [tournamentId]="id"
        [slug]="tournamentSlug()"
        [published]="tournamentPublished()"
      />
    }
  </header>
  <main class="app-shell__content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
