<div class="app-shell">
  <a class="skip-link" href="#main-content" (click)="focusMainContent($event)"
    >Aller au contenu principal</a
  >

  <header class="app-shell__header">
    <div class="app-shell__topbar">
      <div class="app-shell__topbar-left">
        <ap-logo />
        <nav class="app-shell__nav">
          <a routerLink="/admin/tournaments" routerLinkActive="app-shell__link--active">Tournois</a>
          <a routerLink="/admin/collaborators" routerLinkActive="app-shell__link--active"
            >Collaborateurs</a
          >
        </nav>
      </div>
      <div class="app-shell__controls">
        <ap-theme-mode-toggle [mode]="mode()" (modeChange)="onModeChange($event)" />
        <ap-button type="button" variant="ghost" (click)="logout()">Se déconnecter</ap-button>
      </div>
    </div>
    @if (tournamentId(); as id) {
      <app-tournament-submenu [tournamentId]="id" />
    }
  </header>
  <main class="app-shell__content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
