<div class="app-shell">
  <header class="app-shell__header">
    <nav class="app-shell__nav">
      <a routerLink="/admin/tournaments" routerLinkActive="app-shell__link--active">Tournois</a>
      <a routerLink="/admin/collaborators" routerLinkActive="app-shell__link--active"
        >Collaborateurs</a
      >
    </nav>
    <div class="app-shell__controls">
      <ap-select
        class="app-shell__theme-select"
        label="Thème"
        [hideLabel]="true"
        [options]="themeOptions"
        [value]="theme()"
        (valueChange)="onThemeChange($event)"
      />
      <ap-button type="button" variant="ghost" (click)="toggleMode()">
        {{ mode() === 'dark' ? 'Mode clair' : 'Mode sombre' }}
      </ap-button>
      <ap-button type="button" variant="ghost" (click)="logout()">Se déconnecter</ap-button>
    </div>
  </header>
  <main class="app-shell__content">
    <router-outlet />
  </main>
</div>
