<main class="login-page">
  <form class="login-page__card" [formGroup]="form" (ngSubmit)="submit()">
    <ap-logo class="login-page__brand" />
    <h1>Connectez-vous</h1>
    <ap-text-field label="Email" type="email" formControlName="email" autocomplete="email" />
    <ap-text-field
      label="Mot de passe"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (errorMessage(); as message) {
      <p class="login-page__error" role="alert">{{ message }}</p>
    }
    @if (needsVerification()) {
      @if (resent()) {
        <p class="login-page__hint">Email renvoyé.</p>
      } @else {
        <ap-button type="button" [disabled]="submitting()" (click)="resendVerification()">
          Renvoyer l'email de vérification
        </ap-button>
      }
    }
    <ap-button type="submit" [disabled]="submitting()">Se connecter</ap-button>
    <p class="login-page__footer">
      Pas encore de compte ? <a routerLink="/register">Créer une organisation</a>
    </p>
  </form>
</main>
