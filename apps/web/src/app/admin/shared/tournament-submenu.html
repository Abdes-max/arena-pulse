<div class="tournament-submenu-row">
  <nav class="tournament-submenu" #nav>
    <a
      [routerLink]="['/admin/tournaments', tournamentId()]"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="tournament-submenu__link--active"
      (click)="centerTab($event)"
    >
      Général
    </a>
    <a
      [routerLink]="['/admin/tournaments', tournamentId(), 'teams']"
      routerLinkActive="tournament-submenu__link--active"
      (click)="centerTab($event)"
    >
      Équipes
    </a>
    <a
      [routerLink]="['/admin/tournaments', tournamentId(), 'referees']"
      routerLinkActive="tournament-submenu__link--active"
      (click)="centerTab($event)"
    >
      Arbitres
    </a>
    <a
      [routerLink]="['/admin/tournaments', tournamentId(), 'structure']"
      routerLinkActive="tournament-submenu__link--active"
      (click)="centerTab($event)"
    >
      Structure
    </a>
    <a
      [routerLink]="['/admin/tournaments', tournamentId(), 'schedule']"
      routerLinkActive="tournament-submenu__link--active"
      (click)="centerTab($event)"
    >
      Calendrier
    </a>
    <a
      [routerLink]="['/admin/tournaments', tournamentId(), 'scores']"
      routerLinkActive="tournament-submenu__link--active"
      (click)="centerTab($event)"
    >
      Scores
    </a>
    <a
      [routerLink]="['/admin/tournaments', tournamentId(), 'standings']"
      routerLinkActive="tournament-submenu__link--active"
      (click)="centerTab($event)"
    >
      Classement
    </a>
  </nav>

  @if (publicUrl(); as url) {
    <ap-button
      class="tournament-submenu__public-link"
      variant="ghost"
      size="sm"
      [href]="url"
      target="_blank"
    >
      <svg
        class="tournament-submenu__public-link-icon"
        viewBox="0 0 16 16"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M6.5 3H3.5C3.22386 3 3 3.22386 3 3.5V12.5C3 12.7761 3.22386 13 3.5 13H12.5C12.7761 13 13 12.7761 13 12.5V9.5"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M9.5 3H13V6.5M13 3L7.5 8.5"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="ap-sr-only">Lien public</span>
    </ap-button>
  }
</div>
