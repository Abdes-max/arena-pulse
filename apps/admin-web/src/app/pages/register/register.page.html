<main class="register-page">
  <form class="register-page__card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Créer votre organisation</h1>
    <ap-text-field
      label="Nom de l'organisation"
      formControlName="organizationName"
      autocomplete="organization"
    />
    <ap-text-field label="Prénom" formControlName="firstName" autocomplete="given-name" />
    <ap-text-field label="Nom" formControlName="lastName" autocomplete="family-name" />
    <ap-text-field label="Email" type="email" formControlName="email" autocomplete="email" />
    <ap-text-field
      label="Mot de passe"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
    @if (errorMessage(); as message) {
      <p class="register-page__error" role="alert">{{ message }}</p>
    }
    <ap-button type="submit" [disabled]="submitting()">Créer mon organisation</ap-button>
    <p class="register-page__footer">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </form>
</main>
