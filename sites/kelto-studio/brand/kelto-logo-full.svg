<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a463" />
      <stop offset="1" stop-color="#b8592f" />
    </linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="100" height="100" rx="24" /></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="100" height="100" fill="url(#g)" />
    <g transform="translate(50,50) scale(0.74) translate(-50,-50)">
      <g stroke="#7a3f1e" stroke-opacity="0.5" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(4,5)">
        <path d="M30 22 L30 78" />
        <path d="M30 52 L68 20" />
        <path d="M30 50 L70 80" />
      </g>
      <g stroke="#14161a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M30 22 L30 78" />
        <path d="M30 52 L68 20" />
        <path d="M30 50 L70 80" />
      </g>
      <g stroke="#14161a" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M74 28 L85 19" opacity="0.55" />
        <path d="M81 35 L89 29" opacity="0.3" />
      </g>
    </g>
  </g>
  <!-- For light backgrounds: dark wordmark. Same font stack as the site's
       own display-face token in kelto-studio.html, so it resolves to
       whatever that page itself falls back to on a given system (most
       likely Helvetica Neue/Arial either way, but this keeps the two in
       lockstep rather than hard-coding a narrower stack here). Set text,
       not outlined paths; for a print-grade asset, convert to outlines in
       a vector editor first. -->
  <text x="124" y="65" font-family="'Avenir Next', 'Century Gothic', Futura, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" letter-spacing="-0.5" fill="#14161a">Kelto</text>
  <text x="125" y="85" font-family="'Avenir Next', 'Century Gothic', Futura, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#c08a4e">STUDIO</text>
</svg>
