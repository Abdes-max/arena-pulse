<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a463" />
      <stop offset="1" stop-color="#b8592f" />
    </linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="100" height="100" rx="24" /></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="100" height="100" fill="url(#g)" />
    <!-- Simplified for tiny sizes (browser tab, home-screen icon): single
         stroke, no drop-shadow duplicate and no speed-line dashes, both
         wash out below ~32px and just add noise. Slightly larger scale
         than kelto-mark.svg since there's no shadow offset eating into the
         margin either. -->
    <g transform="translate(50,50) scale(0.8) translate(-50,-50)">
      <g stroke="#14161a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M30 22 L30 78" />
        <path d="M30 52 L68 20" />
        <path d="M30 50 L70 80" />
      </g>
    </g>
  </g>
</svg>
