<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Message envoyé - Kelto Studio</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="/brand/favicon-180.png" />
<script src="/theme-init.js"></script>
<style>
  :root {
    --ink: #14161a;
    --parchment: #f4efe6;
    --parchment-dim: #d9d2c4;
    --bronze: #c08a4e;
    --bronze-bright: #e3a463;
    --line: rgba(244, 239, 230, 0.14);
    --line-strong: rgba(244, 239, 230, 0.28);
    --font-display: "Avenir Next", "Century Gothic", Futura, "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  :root[data-theme="light"] {
    --ink: #f6f1e7;
    --parchment: #1a1c20;
    --parchment-dim: #4a4640;
    --line: rgba(20, 22, 26, 0.12);
    --line-strong: rgba(20, 22, 26, 0.24);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    text-align: center;
    background: var(--ink);
    color: var(--parchment);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .mark { width: 64px; height: 64px; }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  p {
    color: var(--parchment-dim);
    max-width: 42ch;
    margin: 0;
    font-size: 1.05rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    background: linear-gradient(120deg, var(--bronze), var(--bronze-bright));
    color: #14161a;
    box-shadow: 0 20px 60px -20px rgba(192, 138, 78, 0.35);
  }

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: none;
    color: var(--parchment);
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .theme-toggle:hover,
  .theme-toggle:focus-visible {
    border-color: var(--bronze-bright);
    color: var(--bronze-bright);
  }

  .theme-toggle svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
  }

  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
</style>
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Passer en mode clair">
    <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="4" />
      <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M16.2 12.4A7 7 0 0 1 7.6 3.8a7 7 0 1 0 8.6 8.6Z" />
    </svg>
  </button>
  <img class="mark" src="/brand/kelto-mark.svg" alt="Kelto Studio" width="64" height="64" />
  <h1>Message envoyé.</h1>
  <p>Merci - nous revenons vers vous sous 48h ouvrées. En attendant, n'hésitez pas à jeter un œil à nos réalisations.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
<script src="/theme.js" defer></script>
</body>
</html>
