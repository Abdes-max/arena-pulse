<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Message envoyé - Kelto Studio</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --ink: #14161a;
    --parchment: #f4efe6;
    --parchment-dim: #d9d2c4;
    --bronze: #c08a4e;
    --bronze-bright: #e3a463;
    --line: rgba(244, 239, 230, 0.14);
    --line-strong: rgba(244, 239, 230, 0.28);
    --font-display: "Avenir Next", "Century Gothic", Futura, "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  :root[data-theme="light"] {
    --ink: #f6f1e7;
    --parchment: #1a1c20;
    --parchment-dim: #4a4640;
    --line: rgba(20, 22, 26, 0.12);
    --line-strong: rgba(20, 22, 26, 0.24);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #f6f1e7;
      --parchment: #1a1c20;
      --parchment-dim: #4a4640;
      --line: rgba(20, 22, 26, 0.12);
      --line-strong: rgba(20, 22, 26, 0.24);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    text-align: center;
    background: var(--ink);
    color: var(--parchment);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .mark { width: 64px; height: 64px; }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  p {
    color: var(--parchment-dim);
    max-width: 42ch;
    margin: 0;
    font-size: 1.05rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    background: linear-gradient(120deg, var(--bronze), var(--bronze-bright));
    color: #14161a;
    box-shadow: 0 20px 60px -20px rgba(192, 138, 78, 0.35);
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e3a463" />
        <stop offset="1" stop-color="#b8592f" />
      </linearGradient>
      <clipPath id="c"><rect x="0" y="0" width="100" height="100" rx="24" /></clipPath>
    </defs>
    <g clip-path="url(#c)">
      <rect width="100" height="100" fill="url(#g)" />
      <g transform="translate(50,50) scale(0.74) translate(-50,-50)">
        <g stroke="#7a3f1e" stroke-opacity="0.5" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(4,5)">
          <path d="M30 22 L30 78" />
          <path d="M30 52 L68 20" />
          <path d="M30 50 L70 80" />
        </g>
        <g stroke="#14161a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M30 22 L30 78" />
          <path d="M30 52 L68 20" />
          <path d="M30 50 L70 80" />
        </g>
      </g>
    </g>
  </svg>
  <h1>Message envoyé.</h1>
  <p>Merci - nous revenons vers vous sous 48h ouvrées. En attendant, n'hésitez pas à jeter un œil à nos réalisations.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</body>
</html>
