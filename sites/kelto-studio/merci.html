<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Message envoyé - Kelto Studio</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="/brand/favicon-180.png" />
<style>
  :root {
    --ink: #14161a;
    --parchment: #f4efe6;
    --parchment-dim: #d9d2c4;
    --bronze: #c08a4e;
    --bronze-bright: #e3a463;
    --line: rgba(244, 239, 230, 0.14);
    --line-strong: rgba(244, 239, 230, 0.28);
    --font-display: "Avenir Next", "Century Gothic", Futura, "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  :root[data-theme="light"] {
    --ink: #f6f1e7;
    --parchment: #1a1c20;
    --parchment-dim: #4a4640;
    --line: rgba(20, 22, 26, 0.12);
    --line-strong: rgba(20, 22, 26, 0.24);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #f6f1e7;
      --parchment: #1a1c20;
      --parchment-dim: #4a4640;
      --line: rgba(20, 22, 26, 0.12);
      --line-strong: rgba(20, 22, 26, 0.24);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    text-align: center;
    background: var(--ink);
    color: var(--parchment);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .mark { width: 64px; height: 64px; }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  p {
    color: var(--parchment-dim);
    max-width: 42ch;
    margin: 0;
    font-size: 1.05rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    background: linear-gradient(120deg, var(--bronze), var(--bronze-bright));
    color: #14161a;
    box-shadow: 0 20px 60px -20px rgba(192, 138, 78, 0.35);
  }
</style>
</head>
<body>
  <img class="mark" src="/brand/kelto-mark.svg" alt="Kelto Studio" width="64" height="64" />
  <h1>Message envoyé.</h1>
  <p>Merci - nous revenons vers vous sous 48h ouvrées. En attendant, n'hésitez pas à jeter un œil à nos réalisations.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</body>
</html>
