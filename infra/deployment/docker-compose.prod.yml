# Self-hostable production stack: postgres + api + web (nginx) + Caddy
# (TLS-terminating reverse proxy), on a single Docker host. No external
# managed service is assumed -- this is the generic baseline (see
# docs/architecture/adr/0004-deployment-strategy.md for why a specific
# PaaS/cloud target was deliberately left undecided).
#
# Usage: from the repo root,
#   cp infra/deployment/.env.example infra/deployment/.env   # then edit it
#   docker compose -f infra/deployment/docker-compose.prod.yml --env-file infra/deployment/.env up -d --build
#
# Caddy handles ports 80/443 and auto-provisions a Let's Encrypt certificate
# for DOMAIN the first time it starts -- point DOMAIN's DNS at this host
# *before* starting the stack, and make sure 80/443 are reachable from the
# internet (see infra/deployment/Caddyfile). web itself is only published on
# 127.0.0.1 (see below), for host-local smoke-testing, not public traffic.
#
# This same Caddy instance also fronts KELTO_DOMAIN (Kelto Studio's own
# marketing site, sites/kelto-studio/ -- a different brand, no relation to
# TournArena beyond sharing this VPS) as a second, independent site block.
# Deployed separately by .github/workflows/deploy-kelto.yml, not by this
# stack's own deploy-prod.yml -- see that workflow's and the Caddyfile's
# comments for why.

name: arena-pulse-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-arena_pulse}
    volumes:
      - arena-pulse-postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arena_pulse} -d ${POSTGRES_DB:-arena_pulse}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations, then seeds reference data
  # (sports, permissions -- apps/api/prisma/seed.ts, all upserts, so safe to
  # rerun on every deploy), then exits. Uses the `build` stage of
  # api.Dockerfile (full source + Prisma CLI), not the pruned `runtime`
  # stage the `api` service below runs -- `runtime` has no devDependencies,
  # so neither the Prisma CLI nor `nest build` (which the seed runner needs)
  # would be available there.
  migrate:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-arena_pulse}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-arena_pulse}?schema=public
    command: ['sh', '-c', 'npx prisma migrate deploy && npx prisma db seed']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-arena_pulse}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-arena_pulse}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set -- e.g. openssl rand -base64 48}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600s}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      # Same-origin for the web app in this deployment shape (its nginx
      # proxies /api/ to this service), but the mobile app is not served
      # from WEB_PUBLIC_ORIGIN at all -- it calls this API directly from its
      # own Capacitor origin, which is fixed by Capacitor itself (not
      # deployment-specific), hence hardcoded here rather than sourced from
      # .env: capacitor://localhost on iOS, https://localhost on Android.
      # main.ts (CORS_ORIGIN parsing) splits on comma.
      CORS_ORIGIN: ${WEB_PUBLIC_ORIGIN:?WEB_PUBLIC_ORIGIN must be set, e.g. https://tournois.example.com},capacitor://localhost,https://localhost
      ADMIN_WEB_URL: ${WEB_PUBLIC_ORIGIN:?}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set -- e.g. smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-TournArena <no-reply@tournarena.com>}
      # Optional, not required-with-:? like JWT_SECRET above -- StripeService
      # only reads these lazily at the moment of an actual paid registration/
      # publication or an incoming webhook (docs/architecture/adr/0005), so
      # the rest of the stack still boots fine before Stripe is configured.
      # A real attempt to pay fails loudly with a clear "not set" error
      # instead, same as leaving it unset in apps/api/.env.example locally.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TOURNAMENT_PUBLICATION_TIER_FREE_MAX_TEAMS: ${TOURNAMENT_PUBLICATION_TIER_FREE_MAX_TEAMS:-8}
      TOURNAMENT_PUBLICATION_TIER_MID_MAX_TEAMS: ${TOURNAMENT_PUBLICATION_TIER_MID_MAX_TEAMS:-48}
      TOURNAMENT_PUBLICATION_TIER_MID_PRICE_CENTS: ${TOURNAMENT_PUBLICATION_TIER_MID_PRICE_CENTS:-0}
      TOURNAMENT_PUBLICATION_TIER_HIGH_PRICE_CENTS: ${TOURNAMENT_PUBLICATION_TIER_HIGH_PRICE_CENTS:-0}
      ORGANIZATION_ANNUAL_SUBSCRIPTION_PRICE_CENTS: ${ORGANIZATION_ANNUAL_SUBSCRIPTION_PRICE_CENTS:-0}
      # Team logos (feat/045) -- must match the volume mount below, and
      # infra/docker/api.Dockerfile's WORKDIR (/app).
      UPLOADS_DIR: /app/uploads
    volumes:
      - arena-pulse-uploads-prod:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    # Bound to the host loopback only -- reachable via `curl localhost:8080`
    # for smoke-testing from the host itself (e.g. before DNS/Caddy are
    # ready), but not from the public internet, since that would bypass
    # Caddy's TLS termination entirely (plain HTTP, no cert).
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  # TLS-terminating reverse proxy -- see infra/deployment/Caddyfile and
  # docs/architecture/adr/0004-deployment-strategy.md, "Conséquences".
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set -- e.g. tournarena.com, with DNS already pointed at this host}
      # Kelto Studio's own marketing site (sites/kelto-studio/), served
      # static off this same Caddy instance -- optional, unlike DOMAIN
      # above, since it's a second brand riding along on this host rather
      # than the thing this stack exists for. Defaults to kelto-studio.fr
      # so existing deploys keep working without touching .env, but only
      # actually serves anything once that domain's DNS points here.
      KELTO_DOMAIN: ${KELTO_DOMAIN:-kelto-studio.fr}
      # Third-party project on the same host, same "riding along" posture as
      # KELTO_DOMAIN above -- see Caddyfile's own comment. Empty by default
      # (unlike KELTO_DOMAIN's real fallback) since there's no sensible
      # default domain for someone else's project; Caddy just never matches
      # that site block until it's set.
      EVOLYFOOT_DOMAIN: ${EVOLYFOOT_DOMAIN:-}
    # `default` kept explicitly (not just `edge`) -- declaring any
    # `networks:` on a service opts it out of the implicit default network
    # otherwise auto-attached, and caddy still needs that one for `web`
    # (depends_on below) and every other service in this file, none of
    # which join `edge`. `edge` itself is EvolyFoot's own external network
    # (its `evolyfoot-web` container is already on it) -- created by that
    # project, not this one, hence `external: true` below rather than a
    # `docker network create edge` this repo would own.
    networks:
      - default
      - edge
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # A fixed host path, not ../../sites/kelto-studio (relative to *this*
      # git checkout) -- deploy-kelto.yml syncs straight to this path over
      # scp, independently of deploy-prod.yml's own `git reset --hard` on
      # this checkout, so a Kelto-only deploy never has to touch (or wait
      # on) whatever TournArena state happens to be mid-deploy here, and
      # vice versa. Defaults to a sibling of DEPLOY_PATH so both still live
      # under the same parent on a fresh host, without either deploy
      # depending on the other's directory.
      - ${KELTO_SITE_DIR:-/opt/kelto-studio}:/srv/kelto-studio:ro
      - caddy-data-prod:/data
      - caddy-config-prod:/config
    depends_on:
      - web

volumes:
  arena-pulse-postgres-prod:
  arena-pulse-uploads-prod:
  caddy-data-prod:
  caddy-config-prod:

networks:
  # Declared, not created, by this stack -- EvolyFoot's own compose project
  # owns this network (its `evolyfoot-web` container is already attached to
  # it); this repo only needs to join it, never `docker network create edge`
  # itself. See caddy's own `networks:` comment above for why it needs this
  # at all.
  edge:
    external: true
