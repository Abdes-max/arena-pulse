# Serves the Angular SPA build and reverse-proxies /api/ to the `api`
# service so the browser only ever talks to one origin -- this is what lets
# apps/web/src/environments/environment.ts use a relative apiUrl ('/api/v1')
# and sidesteps CORS entirely in this deployment shape (infra/deployment/).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Team logos (feat/045) -- same single-origin proxy shape as /api/ above,
  # for the same reason (relative logoUrl paths from the API, no CORS to
  # configure). The api service serves these itself (app.useStaticAssets in
  # main.ts), not nginx directly, since they live on a Docker volume mounted
  # into the api container, not the web image.
  #
  # `^~` (not a plain prefix): nginx picks the longest-matching *regex*
  # location over a plain-prefix one regardless of file order, so every
  # request under here (all image extensions) was silently falling through
  # to the `location ~* \.(?:...|png|...)$` cache-headers block below
  # instead -- serving it as a local static asset from /usr/share/nginx/html
  # (where it doesn't exist) and 404ing, rather than proxying to the api
  # service where the real file lives. `^~` tells nginx to stop looking for
  # a better (regex) match once this prefix matches, which is what actually
  # routes these requests to proxy_pass. Went unnoticed until now: no team
  # logo had ever been successfully uploaded in prod before feat/112's World
  # Cup seed script (itself blocked until then by a separate uploads/
  # ownership bug, see api.Dockerfile).
  location ^~ /uploads/ {
    proxy_pass http://api:3000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular Router uses PathLocationStrategy (no # in URLs) -- any path that
  # doesn't match a static asset falls back to index.html so client-side
  # routing can take over (e.g. a hard reload on /admin/tournaments/:id).
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|ico|png|jpg|jpeg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # index.html references the current build's hashed bundle filenames --
  # without this, a browser that still has a stale (but not yet expired by
  # its own heuristics) copy of index.html keeps requesting old, no-longer-
  # served bundle hashes after a deploy, silently missing new releases.
  # try_files above internally rewrites to this exact-match location too,
  # so the header applies on the SPA-routing fallback as well, not just "/".
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
