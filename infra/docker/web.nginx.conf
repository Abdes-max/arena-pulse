# Serves the Angular SPA build and reverse-proxies /api/ to the `api`
# service so the browser only ever talks to one origin -- this is what lets
# apps/web/src/environments/environment.ts use a relative apiUrl ('/api/v1')
# and sidesteps CORS entirely in this deployment shape (infra/deployment/).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular Router uses PathLocationStrategy (no # in URLs) -- any path that
  # doesn't match a static asset falls back to index.html so client-side
  # routing can take over (e.g. a hard reload on /admin/tournaments/:id).
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|ico|png|jpg|jpeg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # index.html references the current build's hashed bundle filenames --
  # without this, a browser that still has a stale (but not yet expired by
  # its own heuristics) copy of index.html keeps requesting old, no-longer-
  # served bundle hashes after a deploy, silently missing new releases.
  # try_files above internally rewrites to this exact-match location too,
  # so the header applies on the SPA-routing fallback as well, not just "/".
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
